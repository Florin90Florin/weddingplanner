<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie Foto</title>

<link rel="stylesheet" href="style.css">

<style>

/* HEADER */
.gallery-header {
  padding: 20px;
  text-align: center;
}

.back-btn {
  display: inline-block;
  margin-bottom: 10px;
  text-decoration: none;
  color: #d4a373;
  font-weight: 600;
}

/* TITLE */
.gallery-header h1 {
  font-size: 26px;
  font-family: 'Playfair Display', serif;
}

/* GRID */
.full-gallery {
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ITEM */
.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  cursor: pointer;
}

/* IMAGE */
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

/* ZOOM */
.gallery-item:hover img {
  transform: scale(1.08);
}

/* OVERLAY */
.gallery-item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.2);
  opacity: 0;
  transition: 0.4s ease;
  pointer-events: none;
}

.gallery-item:hover::after {
  opacity: 1;
}

/* DESKTOP */
@media (min-width: 768px) {
  .full-gallery {
    grid-template-columns: 1fr 1fr 1fr;
  }
}

</style>

</head>

<body>


<div class="gallery-wrapper">
  <div class="gallery-container">
<div class="gallery-header">
  <a href="index.html" class="back-btn">← Înapoi</a>
  <h1>Galerie foto</h1>
</div>

<div class="full-gallery">

  <div class="gallery-item">
    <img src="img1.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img2.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img3.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img4.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img5.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img6.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="img7.jpg" onclick="openLightbox(this)">
  </div>

  <div class="gallery-item">
    <img src="poze/fundal.jpg" onclick="openLightbox(this)">
  </div>

  <!-- POZA VERTICALĂ -->
  <div class="gallery-item">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=1200" onclick="openLightbox(this)">
  </div>

</div>
 </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close-lightbox" onclick="closeLightbox()">✖</span>
  <span class="prev" onclick="changeSlide(-1)">❮</span>
  <img id="lightbox-img">
  <span class="next" onclick="changeSlide(1)">❯</span>
</div>

<script>
let currentIndex = 0;
let images = [];

function openLightbox(img) {
  images = Array.from(document.querySelectorAll(".gallery-item img")); // 🔥 FIX FINAL
  currentIndex = images.indexOf(img);

  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = img.src;
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function changeSlide(direction) {
  currentIndex += direction;

  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;

  document.getElementById("lightbox-img").src = images[currentIndex].src;
}
</script>

</body>
</html>
