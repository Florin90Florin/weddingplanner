<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* HEADER */
    .gallery-header {
      padding: 20px;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 10px;
      text-decoration: none;
      color: #d4a373;
      font-weight: 600;
    }

    /* TITLE */
    .gallery-header h1 {
      font-size: 26px;
      font-family: 'Playfair Display', serif;
    }

    /* GRID */
    .full-gallery {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ITEM */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
    }

    /* IMAGE */
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    /* ZOOM */
    .gallery-item:hover img {
      transform: scale(1.08);
    }

    /* OVERLAY */
    .gallery-item::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: 0.4s ease;
      pointer-events: none;
    }

    .gallery-item:hover::after {
      opacity: 1;
    }

    /* DESKTOP */
    @media (min-width: 768px) {
      .full-gallery {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>

</head>

<body>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">

    <span class="close-lightbox" onclick="event.stopPropagation(); closeLightbox()">✖</span>

    <span class="prev" onclick="event.stopPropagation(); changeSlide(-1)">❮</span>
    <img id="lightbox-img" onclick="event.stopPropagation()">
    <span class="next" onclick="event.stopPropagation(); changeSlide(1)">❯</span>

  </div>

  <script>
    const lightbox = document.getElementById("lightbox");

    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });
  </script>
